name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 离线自检（不请求上游）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  live:
    # 只在手动触发时跑：这一套会真实请求图书馆服务器，
    # 不该在每次 push 时去打人家。需要时在 Actions 页面点 "Run workflow"。
    name: 回归测试（会请求上游，手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/regression.mjs
      - run: node test/smoke.mjs
